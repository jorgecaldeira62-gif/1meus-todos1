<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor HTML - Definitivo</title>
<!-- JSZip para importar/exportar -->
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #121212; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  
  /* Barra superior */
  .toolbar { background: #1e1e1e; padding: 10px; display: flex; gap: 10px; border-bottom: 1px solid #333; }
  button { background: #2a5298; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
  button:hover { background: #1e3c72; }
  button.danger { background: #d32f2f; }
  button.danger:hover { background: #b71c1c; }
  
  /* Layout principal */
  .main { display: flex; flex: 1; height: calc(100vh - 50px); }
  
  /* Barra lateral (Arquivos) */
  .sidebar { width: 250px; background: #1e1e1e; border-right: 1px solid #333; display: flex; flex-direction: column; }
  .file-list { flex: 1; overflow-y: auto; padding: 10px; }
  .file-item { padding: 8px; margin-bottom: 5px; background: #2d2d2d; border-radius: 4px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; word-break: break-all; }
  .file-item:hover { background: #3d3d3d; }
  .file-item.active { background: #2a5298; border-left: 4px solid #64b5f6; }
  .delete-btn { background: transparent; color: #ff5252; padding: 2px 5px; font-size: 16px; }
  .delete-btn:hover { background: rgba(255,0,0,0.2); }
  
  /* Área de Edição e Preview */
  .workspace { flex: 1; display: flex; flex-direction: column; }
  .panels { display: flex; flex: 1; }
  
  /* Editor de Código */
  .editor-container { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #333; }
  .panel-header { background: #252525; padding: 5px 10px; font-size: 12px; color: #aaa; border-bottom: 1px solid #333; }
  textarea { flex: 1; background: #121212; color: #00ff00; font-family: monospace; font-size: 14px; padding: 15px; border: none; resize: none; outline: none; white-space: pre; overflow-wrap: normal; overflow-x: auto; }
  
  /* Preview */
  .preview-container { flex: 1; display: flex; flex-direction: column; background: #fff; }
  iframe { flex: 1; width: 100%; height: 100%; border: none; background: #fff; }
</style>
</head>
<body>

<div class="toolbar">
  <button onclick="document.getElementById('zip-upload').click()">📦 Importar ZIP</button>
  <input type="file" id="zip-upload" accept=".zip" style="display: none;" onchange="importZip(event)">
  <button onclick="exportZip()">💾 Exportar ZIP</button>
  <button onclick="createNewFile()">📄 Novo Arquivo</button>
  <button onclick="updatePreview()" style="margin-left: auto; background: #2e7d32;">▶️ Atualizar Preview</button>
</div>

<div class="main">
  <div class="sidebar">
    <div class="panel-header">ARQUIVOS</div>
    <div class="file-list" id="file-list"></div>
  </div>
  
  <div class="workspace">
    <div class="panels">
      <div class="editor-container">
        <div class="panel-header" id="current-file-name">Nenhum arquivo selecionado</div>
        <textarea id="code-editor" oninput="saveCurrentFile()" placeholder="O código aparecerá aqui..."></textarea>
      </div>
      <div class="preview-container">
        <div class="panel-header" style="background: #e0e0e0; color: #333;">PREVIEW (index.html)</div>
        <iframe id="preview-frame"></iframe>
      </div>
    </div>
  </div>
</div>

<script>
// Estrutura: { "index.html": { type: "text", content: "..." }, "img.png": { type: "base64", content: "..." } }
let files = {};
let currentFile = null;

// Extensões tratadas como texto (o resto será tratado como base64/imagem para não corromper)
const textExtensions = ['html', 'htm', 'css', 'js', 'txt', 'json', 'md', 'xml', 'svg'];

function getExtension(filename) {
  return filename.split('.').pop().toLowerCase();
}

// 1. IMPORTAR ZIP
async function importZip(event) {
  const file = event.target.files[0];
  if (!file) return;

  try {
    const zip = await JSZip.loadAsync(file);
    files = {}; // Limpa arquivos atuais
    
    for (const [path, obj] of Object.entries(zip.files)) {
      if (obj.dir) continue; // Ignora pastas vazias
      
      const ext = getExtension(path);
      const isText = textExtensions.includes(ext);
      
      if (isText) {
        const content = await obj.async("string");
        files[path] = { type: "text", content: content };
      } else {
        const content = await obj.async("base64");
        files[path] = { type: "base64", content: content };
      }
    }
    
    alert("✅ ZIP importado com sucesso!");
    renderFileList();
    
    // Tenta abrir o index.html por padrão, ou o primeiro arquivo
    if (files["index.html"]) {
      openFile("index.html");
    } else {
      const firstFile = Object.keys(files)[0];
      if (firstFile) openFile(firstFile);
    }
    
    updatePreview();
  } catch (error) {
    alert("❌ Erro ao importar ZIP: " + error.message);
  }
  event.target.value = ''; // Reseta o input
}

// 2. EXPORTAR ZIP
async function exportZip() {
  if (Object.keys(files).length === 0) {
    alert("Não há arquivos para exportar.");
    return;
  }

  try {
    const zip = new JSZip();
    
    for (const [path, data] of Object.entries(files)) {
      if (data.type === "text") {
        zip.file(path, data.content);
      } else {
        zip.file(path, data.content, { base64: true });
      }
    }
    
    const blob = await zip.generateAsync({ type: "blob" });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = "projeto_editado.zip";
    link.click();
  } catch (error) {
    alert("❌ Erro ao exportar ZIP: " + error.message);
  }
}

// 3. RENDERIZAR LISTA DE ARQUIVOS
function renderFileList() {
  const list = document.getElementById('file-list');
  list.innerHTML = '';
  
  Object.keys(files).sort().forEach(filename => {
    const div = document.createElement('div');
    div.className = 'file-item' + (filename === currentFile ? ' active' : '');
    
    const nameSpan = document.createElement('span');
    nameSpan.textContent = filename;
    nameSpan.style.flex = "1";
    nameSpan.onclick = () => openFile(filename);
    
    const delBtn = document.createElement('button');
    delBtn.textContent = '✖';
    delBtn.className = 'delete-btn';
    delBtn.onclick = (e) => {
      e.stopPropagation();
      deleteFile(filename);
    };
    
    div.appendChild(nameSpan);
    div.appendChild(delBtn);
    list.appendChild(div);
  });
}

// 4. ABRIR ARQUIVO NO EDITOR
function openFile(filename) {
  currentFile = filename;
  document.getElementById('current-file-name').textContent = filename;
  
  const editor = document.getElementById('code-editor');
  
  if (files[filename].type === "text") {
    editor.value = files[filename].content;
    editor.disabled = false;
  } else {
    editor.value = "[Arquivo Binário / Imagem]\nNão é possível editar este arquivo como texto.";
    editor.disabled = true;
  }
  
  renderFileList();
}

// 5. SALVAR ARQUIVO ATUAL (ao digitar)
function saveCurrentFile() {
  if (currentFile && files[currentFile] && files[currentFile].type === "text") {
    files[currentFile].content = document.getElementById('code-editor').value;
  }
}

// 6. CRIAR NOVO ARQUIVO
function createNewFile() {
  const filename = prompt("Digite o nome do arquivo (ex: index.html, style.css):");
  if (!filename) return;
  
  if (files[filename]) {
    alert("Já existe um arquivo com este nome!");
    return;
  }
  
  files[filename] = { type: "text", content: "" };
  
  // Se for HTML básico, já coloca uma estrutura
  if (filename.endsWith('.html')) {
    files[filename].content = "<!DOCTYPE html>\n<html>\n<head>\n<meta charset='UTF-8'>\n<title>Novo Documento</title>\n</head>\n<body>\n\n</body>\n</html>";
  }
  
  renderFileList();
  openFile(filename);
}

// 7. DELETAR ARQUIVO
function deleteFile(filename) {
  if (confirm(`Tem certeza que deseja apagar ${filename}?`)) {
    delete files[filename];
    if (currentFile === filename) {
      currentFile = null;
      document.getElementById('code-editor').value = "";
      document.getElementById('current-file-name').textContent = "Nenhum arquivo selecionado";
    }
    renderFileList();
    updatePreview();
  }
}

// 8. ATUALIZAR PREVIEW (Injeta CSS, JS e Imagens no HTML)
function updatePreview() {
  const iframe = document.getElementById('preview-frame');
  
  // Procura o arquivo principal para o preview (index.html ou o primeiro .html que achar)
  let htmlFile = "index.html";
  if (!files[htmlFile]) {
    htmlFile = Object.keys(files).find(f => f.endsWith('.html'));
  }
  
  if (!htmlFile || !files[htmlFile]) {
    iframe.srcdoc = "<h3 style='font-family:sans-serif; color:#666; padding:20px;'>Crie ou importe um arquivo .html para ver o preview.</h3>";
    return;
  }

  let htmlContent = files[htmlFile].content;

  // Substitui caminhos de imagens locais por Base64 para funcionar no iframe
  Object.keys(files).forEach(filename => {
    if (files[filename].type === "base64") {
      const ext = getExtension(filename);
      let mime = "application/octet-stream";
      if (ext === 'png') mime = "image/png";
      else if (ext === 'jpg' || ext === 'jpeg') mime = "image/jpeg";
      else if (ext === 'gif') mime = "image/gif";
      
      const dataURI = `data:${mime};base64,${files[filename].content}`;
      
      // Substitui o nome do arquivo no HTML pelo Data URI
      // Ex: src="img.png" vira src="data:image/png;base64,..."
      const regex = new RegExp(filename, 'g');
      htmlContent = htmlContent.replace(regex, dataURI);
    } 
    // Injeta CSS
    else if (filename.endsWith('.css')) {
      const cssRegex = new RegExp(`<link[^>]*href=["']\\.?/?${filename}["'][^>]*>`, 'gi');
      if (htmlContent.match(cssRegex)) {
        htmlContent = htmlContent.replace(cssRegex, `<style>${files[filename].content}</style>`);
      } else {
        htmlContent = htmlContent.replace('</head>', `<style>${files[filename].content}</style></head>`);
      }
    }
    // Injeta JS
    else if (filename.endsWith('.js')) {
      const jsRegex = new RegExp(`<script[^>]*src=["']\\.?/?${filename}["'][^>]*><\\/script>`, 'gi');
      if (htmlContent.match(jsRegex)) {
        htmlContent = htmlContent.replace(jsRegex, `<script>${files[filename].content}<\/script>`);
      }
    }
  });

  iframe.srcdoc = htmlContent;
}

// Inicialização vazia
updatePreview();
</script>
</body>
</html>
