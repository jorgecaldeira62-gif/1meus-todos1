<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💬 Chat com Voz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: auto;
            background: #1e293b;
            border-radius: 10px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            height: 90vh;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .header {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            padding: 20px;
            border-radius: 10px 10px 0 0;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 12px;
            opacity: 0.9;
        }

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .mensagem {
            display: flex;
            gap: 10px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .mensagem.usuario {
            justify-content: flex-end;
        }

        .mensagem.ia {
            justify-content: flex-start;
        }

        .bolha {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
        }

        .usuario .bolha {
            background: #3b82f6;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ia .bolha {
            background: #0f172a;
            color: #f1f5f9;
            border: 1px solid #334155;
            border-bottom-left-radius: 4px;
        }

        .footer {
            padding: 20px;
            border-top: 1px solid #334155;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background: #3b82f6;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
            flex: 1;
            min-width: 120px;
        }

        button:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        button:disabled {
            background: #64748b;
            cursor: not-allowed;
            transform: none;
        }

        .btn-falar {
            background: #22c55e;
        }

        .btn-falar:hover {
            background: #16a34a;
        }

        .btn-falar.gravando {
            background: #ef4444;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .status {
            padding: 10px 15px;
            background: #0f172a;
            border-radius: 6px;
            font-size: 12px;
            border-left: 3px solid #22c55e;
        }

        .status.escutando {
            border-left-color: #3b82f6;
            color: #3b82f6;
        }

        .status.falando {
            border-left-color: #f59e0b;
            color: #f59e0b;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f172a;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💬 Chat com Voz</h1>
            <p>Fale ou digite para conversar</p>
        </div>

        <div class="chat" id="chat"></div>

        <div class="footer">
            <div class="status" id="status">✅ Pronto</div>
            <button class="btn-falar" id="btnFalar" onclick="iniciarGravacao()">
                🎤 Falar
            </button>
            <button onclick="enviarTexto()">📤 Enviar</button>
        </div>
    </div>

    <script>
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'pt-BR';
        recognition.continuous = false;
        recognition.interimResults = true;

        let gravando = false;
        let inputTexto = '';

        // ── INICIAR GRAVAÇÃO ──
        function iniciarGravacao() {
            if (gravando) {
                recognition.stop();
                return;
            }

            gravando = true;
            document.getElementById('btnFalar').classList.add('gravando');
            document.getElementById('btnFalar').textContent = '🎤 Gravando...';
            document.getElementById('status').textContent = '🎤 Escutando...';
            document.getElementById('status').className = 'status escutando';

            recognition.start();
        }

        // ── RESULTADO DA GRAVAÇÃO ──
        recognition.onresult = (event) => {
            inputTexto = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
                inputTexto += event.results[i][0].transcript;
            }
        };

        // ── FIM DA GRAVAÇÃO ──
        recognition.onend = () => {
            gravando = false;
            document.getElementById('btnFalar').classList.remove('gravando');
            document.getElementById('btnFalar').textContent = '🎤 Falar';
            document.getElementById('status').textContent = '✅ Pronto';
            document.getElementById('status').className = 'status';

            if (inputTexto.trim()) {
                enviarMensagem(inputTexto);
            }
        };

        // ── ENVIAR TEXTO ──
        function enviarTexto() {
            const input = prompt('Digite sua mensagem:');
            if (input && input.trim()) {
                enviarMensagem(input);
            }
        }

        // ── ENVIAR MENSAGEM ──
        function enviarMensagem(texto) {
            // Adicionar mensagem do usuário
            adicionarMensagem(texto, 'usuario');

            // Simular resposta da IA
            setTimeout(() => {
                const respostas = [
                    'Entendi! Você disse: ' + texto,
                    'Muito interessante! Pode me contar mais?',
                    'Isso é importante. Como posso ajudar?',
                    'Compreendo. Qual é sua dúvida?',
                    'Ótimo ponto! Vamos explorar isso.'
                ];

                const resposta = respostas[Math.floor(Math.random() * respostas.length)];
                adicionarMensagem(resposta, 'ia');
                
                // IA fala a resposta
                falarResposta(resposta);
            }, 500);
        }

        // ── ADICIONAR MENSAGEM ──
        function adicionarMensagem(texto, tipo) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = 'mensagem ' + tipo;
            div.innerHTML = `<div class="bolha">${texto}</div>`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        // ── IA FALA ──
        function falarResposta(texto) {
            document.getElementById('status').textContent = '🎤 Falando...';
            document.getElementById('status').className = 'status falando';

            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'pt-BR';
            utterance.rate = 1;
            utterance.pitch = 1;
            utterance.volume = 1;

            utterance.onend = () => {
                document.getElementById('status').textContent = '✅ Pronto';
                document.getElementById('status').className = 'status';
            };

            window.speechSynthesis.speak(utterance);
        }

        // Mensagem inicial
        adicionarMensagem('Olá! Clique em "Falar" ou "Enviar" para começar a conversa.', 'ia');
    </script>
</body>
</html>
