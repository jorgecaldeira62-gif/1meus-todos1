<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Navegador</title>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <style>
        body { margin: 0; font-family: Arial; }
        .bar { background: #333; color: white; padding: 8px; display: flex; gap: 5px; }
        input { flex: 1; padding: 5px; border: none; }
        button { padding: 5px 10px; background: #007bff; color: white; border: none; cursor: pointer; }
        iframe { width: 100%; height: calc(100vh - 50px); border: none; }
        #google_translate_element { font-size: 12px; }
    </style>
</head>
<body>
    <div class="bar">
        <input type="text" id="url" placeholder="Link..." value="https://example.com">
        <button onclick="ir()">Ir</button>
        <div id="google_translate_element"></div>
    </div>
    <iframe id="frame"></iframe>

    <script>
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage: 'en'}, 'google_translate_element');
        }
        
        function ir() {
            let url = document.getElementById('url').value;
            if (!url.startsWith('http')) url = 'https://' + url;
            document.getElementById('frame').src = url;
        }
        
        ir();
    </script>
</body>
</html>
