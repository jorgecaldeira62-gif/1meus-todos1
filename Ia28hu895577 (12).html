<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub Jurídico - Editor + IA + GitHub</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="Editor de código jurídico com IA, GitHub e geração de APK">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --primary: #3b82f6;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --accent: #7c3aed;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0;
            display: flex;
            height: 100vh;
            flex-direction: column;
        }

        /* ── HEADER ── */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background-color: var(--card);
            border-bottom: 1px solid var(--border);
            gap: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 800;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #3b82f6, #22c55e);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        nav {
            display: flex;
            gap: 20px;
            flex: 1;
        }

        nav button {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.2s;
            font-weight: 500;
        }

        nav button:hover {
            background-color: var(--border);
            color: var(--text);
        }

        nav button.active {
            background-color: var(--primary);
            color: white;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: #2563eb;
        }

        .btn-secondary {
            background-color: var(--border);
            color: var(--text);
        }

        .btn-secondary:hover {
            background-color: #475569;
        }

        .btn-success {
            background-color: var(--success);
            color: white;
        }

        .btn-success:hover {
            background-color: #16a34a;
        }

        /* ── MAIN CONTENT ── */
        main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* ── SIDEBAR ── */
        .sidebar {
            width: 280px;
            background-color: var(--card);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .sidebar-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sidebar-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .sidebar-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            color: var(--muted);
            border-left: 3px solid transparent;
        }

        .sidebar-item:hover {
            background-color: var(--border);
            color: var(--text);
        }

        .sidebar-item.active {
            background-color: var(--primary);
            color: white;
            border-left-color: var(--success);
        }

        /* ── EDITOR AREA ── */
        .editor-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .editor-tabs {
            display: flex;
            gap: 0;
            background-color: var(--card);
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            padding: 0 16px;
        }

        .editor-tab {
            padding: 12px 16px;
            border: none;
            background: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 13px;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .editor-tab:hover {
            color: var(--text);
        }

        .editor-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .editor-tab .close {
            margin-left: 6px;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .editor-tab .close:hover {
            opacity: 1;
        }

        .editor-content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .editor-panel {
            flex: 1;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .editor-panel.active {
            display: flex;
        }

        textarea {
            flex: 1;
            background-color: var(--bg);
            color: var(--text);
            border: none;
            padding: 16px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: none;
            outline: none;
        }

        /* ── MODALS ── */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .modal-header h2 {
            font-size: 20px;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            color: var(--text);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
        }

        input, textarea.form-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background-color: var(--bg);
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input:focus, textarea.form-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        textarea.form-input {
            resize: vertical;
            min-height: 100px;
        }

        /* ── GRID ── */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.2s;
        }

        .card:hover {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.1);
        }

        .card h2 {
            font-size: 18px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card p {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 16px;
            line-height: 1.6;
        }

        /* ── PROJECTS LIST ── */
        .projects-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .project-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .project-item:hover {
            background-color: var(--card);
            border-color: var(--primary);
        }

        .project-avatar {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: linear-gradient(135deg, #3b82f6, #22c55e);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 14px;
        }

        .project-info {
            flex: 1;
        }

        .project-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }

        .project-meta {
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
        }

        .project-actions {
            display: flex;
            gap: 6px;
        }

        .project-actions button {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            padding: 4px;
            transition: color 0.2s;
        }

        .project-actions button:hover {
            color: var(--text);
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }

            .container {
                flex-direction: column;
            }

            nav {
                flex-wrap: wrap;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }

        /* ── SCROLLBAR ── */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--muted);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- HEADER -->
    <header>
        <div class="logo">
            <div class="logo-icon">&lt;/&gt;</div>
            <span>Hub Jurídico</span>
        </div>
        <nav id="mainNav">
            <button class="nav-btn active" data-page="projetos">📁 Projetos</button>
            <button class="nav-btn" data-page="editor">✏️ Editor</button>
            <button class="nav-btn" data-page="terminal">⌨️ Terminal</button>
            <button class="nav-btn" data-page="ia">🤖 IA</button>
            <button class="nav-btn" data-page="github">🐙 GitHub</button>
            <button class="nav-btn" data-page="apk">📦 APK</button>
        </nav>
        <div class="header-actions">
            <button class="btn btn-primary" onclick="openNewProjectModal()">+ Novo</button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main>
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">Projetos Recentes</div>
                <div id="recentProjects"></div>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-title">Ações Rápidas</div>
                <button class="sidebar-item" onclick="openNewProjectModal()">+ Novo Projeto</button>
                <button class="sidebar-item" onclick="importZip()">📥 Importar ZIP</button>
                <button class="sidebar-item" onclick="exportZip()">📤 Exportar ZIP</button>
            </div>
        </aside>

        <!-- EDITOR AREA -->
        <div class="editor-area">
            <!-- PAGES -->
            <div id="projetosPage" class="page active">
                <div style="padding: 20px; overflow-y: auto; flex: 1;">
                    <h1 style="margin-bottom: 20px;">📁 Meus Projetos</h1>
                    <div class="projects-list" id="projectsList"></div>
                </div>
            </div>

            <div id="editorPage" class="page">
                <div class="editor-tabs" id="editorTabs"></div>
                <div class="editor-content" id="editorContent"></div>
            </div>

            <div id="terminalPage" class="page">
                <div style="padding: 20px; color: var(--muted);">
                    Terminal será implementado aqui
                </div>
            </div>

            <div id="iaPage" class="page">
                <div style="padding: 20px; color: var(--muted);">
                    IA será implementada aqui
                </div>
            </div>

            <div id="githubPage" class="page">
                <div style="padding: 20px; color: var(--muted);">
                    GitHub será implementado aqui
                </div>
            </div>

            <div id="apkPage" class="page">
                <div style="padding: 20px; color: var(--muted);">
                    APK será implementado aqui
                </div>
            </div>
        </div>
    </main>
</div>

<!-- MODALS -->
<div id="newProjectModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Novo Projeto</h2>
            <button class="close-btn" onclick="closeModal('newProjectModal')">×</button>
        </div>
        <form onsubmit="createProject(event)">
            <div class="form-group">
                <label>Nome do Projeto</label>
                <input type="text" id="projectName" placeholder="Meu Projeto" required>
            </div>
            <div class="form-group">
                <label>Descrição (opcional)</label>
                <textarea class="form-input" id="projectDesc" placeholder="Descrição..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Criar Projeto</button>
        </form>
    </div>
</div>

<script>
    // ── STATE ──
    let projects = JSON.parse(localStorage.getItem('projects')) || [];
    let activeProject = null;
    let currentPage = 'projetos';

    // ── UTILS ──
    function saveProjects() {
        localStorage.setItem('projects', JSON.stringify(projects));
        renderProjects();
    }

    function openModal(id) {
        document.getElementById(id).classList.add('active');
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('active');
    }

    function openNewProjectModal() {
        openModal('newProjectModal');
    }

    // ── PROJECTS ──
    function createProject(e) {
        e.preventDefault();
        const name = document.getElementById('projectName').value;
        const desc = document.getElementById('projectDesc').value;
        
        const project = {
            id: Date.now().toString(),
            name,
            desc,
            files: [],
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString(),
        };

        projects.push(project);
        saveProjects();
        closeModal('newProjectModal');
        document.getElementById('projectName').value = '';
        document.getElementById('projectDesc').value = '';
        alert(`✅ Projeto "${name}" criado!`);
    }

    function renderProjects() {
        const list = document.getElementById('projectsList');
        const recent = document.getElementById('recentProjects');

        if (projects.length === 0) {
            list.innerHTML = '<p style="color: var(--muted); text-align: center; padding: 40px;">Nenhum projeto. Clique em "+ Novo" para começar.</p>';
            recent.innerHTML = '';
            return;
        }

        list.innerHTML = projects.map(p => `
            <div class="project-item" onclick="openProject('${p.id}')">
                <div class="project-avatar">${p.name.charAt(0).toUpperCase()}</div>
                <div class="project-info">
                    <div class="project-name">${p.name}</div>
                    <div class="project-meta">${p.files.length} arquivo(s) · ${new Date(p.updatedAt).toLocaleDateString('pt-BR')}</div>
                </div>
                <div class="project-actions">
                    <button onclick="editProject('${p.id}'); event.stopPropagation();">✏️</button>
                    <button onclick="deleteProject('${p.id}'); event.stopPropagation();">🗑️</button>
                </div>
            </div>
        `).join('');

        recent.innerHTML = projects.slice(0, 3).map(p => `
            <button class="sidebar-item" onclick="openProject('${p.id}')">${p.name}</button>
        `).join('');
    }

    function openProject(id) {
        activeProject = projects.find(p => p.id === id);
        if (activeProject) {
            currentPage = 'editor';
            switchPage('editor');
            renderEditor();
        }
    }

    function editProject(id) {
        const project = projects.find(p => p.id === id);
        if (project) {
            const newName = prompt('Novo nome:', project.name);
            if (newName) {
                project.name = newName;
                project.updatedAt = new Date().toISOString();
                saveProjects();
            }
        }
    }

    function deleteProject(id) {
        if (confirm('Tem certeza que deseja excluir este projeto?')) {
            projects = projects.filter(p => p.id !== id);
            saveProjects();
        }
    }

    // ── EDITOR ──
    function renderEditor() {
        if (!activeProject) return;

        const tabs = document.getElementById('editorTabs');
        const content = document.getElementById('editorContent');

        if (activeProject.files.length === 0) {
            tabs.innerHTML = '<button class="editor-tab active">Novo Arquivo</button>';
            content.innerHTML = '<textarea placeholder="Comece a digitar..."></textarea>';
            return;
        }

        tabs.innerHTML = activeProject.files.map((f, i) => `
            <button class="editor-tab ${i === 0 ? 'active' : ''}" onclick="switchTab(${i})">
                ${f.name}
                <span class="close" onclick="deleteFile(${i}); event.stopPropagation();">×</span>
            </button>
        `).join('');

        content.innerHTML = activeProject.files.map((f, i) => `
            <textarea class="editor-panel ${i === 0 ? 'active' : ''}" onchange="updateFile(${i}, this.value)" placeholder="Código...">${f.content}</textarea>
        `).join('');
    }

    function switchTab(index) {
        document.querySelectorAll('.editor-tab').forEach((t, i) => {
            t.classList.toggle('active', i === index);
        });
        document.querySelectorAll('.editor-panel').forEach((p, i) => {
            p.classList.toggle('active', i === index);
        });
    }

    function updateFile(index, content) {
        if (activeProject) {
            activeProject.files[index].content = content;
            activeProject.updatedAt = new Date().toISOString();
            saveProjects();
        }
    }

    function deleteFile(index) {
        if (activeProject && confirm('Excluir arquivo?')) {
            activeProject.files.splice(index, 1);
            activeProject.updatedAt = new Date().toISOString();
            saveProjects();
            renderEditor();
        }
    }

    // ── NAVIGATION ──
    function switchPage(page) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(page + 'Page').classList.add('active');

        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`[data-page="${page}"]`).classList.add('active');

        currentPage = page;
    }

    // ── IMPORT / EXPORT ──
    function importZip() {
        alert('Importar ZIP será implementado');
    }

    function exportZip() {
        if (!activeProject) {
            alert('Selecione um projeto primeiro');
            return;
        }
        alert(`Exportar "${activeProject.name}" será implementado`);
    }

    // ── INIT ──
    document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            switchPage(btn.dataset.page);
        });
    });

    renderProjects();
</script>

</body>
</html>
