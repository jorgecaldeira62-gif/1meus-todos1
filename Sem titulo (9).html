<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robô Jurídico - Núcleo Base</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 100%);
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: #2d2d44;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            height: 90vh;
            border: 2px solid #4a4a6a;
        }

        /* CABEÇALHO */
        .header {
            background: linear-gradient(135deg, #3d3d5c 0%, #4a4a6a 100%);
            padding: 20px;
            border-bottom: 2px solid #5a5a7a;
            text-align: center;
        }

        .header h1 {
            color: #00d4ff;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .header p {
            color: #b0b0d0;
            font-size: 12px;
        }

        /* STATUS DO ROBÔ */
        .status-bar {
            display: flex;
            gap: 10px;
            padding: 10px 20px;
            background: #252535;
            border-bottom: 1px solid #4a4a6a;
            font-size: 12px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff00;
        }

        .status-item.inactive .status-dot {
            background: #666;
        }

        /* CHAT */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 8px;
            word-wrap: break-word;
        }

        .message.user .message-bubble {
            background: #00d4ff;
            color: #000;
            border-radius: 8px 0 8px 8px;
        }

        .message.robot .message-bubble {
            background: #3d3d5c;
            color: #e0e0e0;
            border-radius: 0 8px 8px 8px;
            border-left: 3px solid #00d4ff;
        }

        .message-time {
            font-size: 10px;
            color: #888;
            margin-top: 4px;
        }

        /* INPUT */
        .input-area {
            padding: 20px;
            background: #252535;
            border-top: 2px solid #4a4a6a;
            display: flex;
            gap: 10px;
        }

        .input-field {
            flex: 1;
            padding: 12px;
            background: #3d3d5c;
            border: 1px solid #4a4a6a;
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 14px;
        }

        .input-field:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 8px rgba(0, 212, 255, 0.3);
        }

        .btn-send {
            padding: 12px 24px;
            background: #00d4ff;
            color: #000;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-send:hover {
            background: #00b8d4;
            transform: translateY(-2px);
        }

        .btn-send:active {
            transform: translateY(0);
        }

        /* SCROLLBAR */
        .chat-area::-webkit-scrollbar {
            width: 8px;
        }

        .chat-area::-webkit-scrollbar-track {
            background: #2d2d44;
        }

        .chat-area::-webkit-scrollbar-thumb {
            background: #4a4a6a;
            border-radius: 4px;
        }

        .chat-area::-webkit-scrollbar-thumb:hover {
            background: #5a5a7a;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- CABEÇALHO -->
        <div class="header">
            <h1>⚖️ ROBÔ JURÍDICO</h1>
            <p>Núcleo Base - Versão 0.1 | Baseado em Princípios</p>
        </div>

        <!-- STATUS -->
        <div class="status-bar">
            <div class="status-item">
                <div class="status-dot"></div>
                <span>Sistema: Ativo</span>
            </div>
            <div class="status-item">
                <div class="status-dot"></div>
                <span>Memória: Conectada</span>
            </div>
            <div class="status-item inactive">
                <div class="status-dot"></div>
                <span>Silogismo: Aguardando</span>
            </div>
        </div>

        <!-- CHAT -->
        <div class="chat-area" id="chatArea">
            <div class="message robot">
                <div>
                    <div class="message-bubble">
                        Olá! Sou o Robô Jurídico. Estou aqui para ajudar você com análise de fatos e lógica jurídica.
                    </div>
                    <div class="message-time">Agora</div>
                </div>
            </div>
            <div class="message robot">
                <div>
                    <div class="message-bubble">
                        Princípio 1: Fato é fato. Conte-me os fatos do seu caso.
                    </div>
                    <div class="message-time">Agora</div>
                </div>
            </div>
        </div>

        <!-- INPUT -->
        <div class="input-area">
            <input 
                type="text" 
                class="input-field" 
                id="inputField" 
                placeholder="Digite os fatos do seu caso..."
                autocomplete="off"
            >
            <button class="btn-send" id="btnSend">Enviar</button>
        </div>
    </div>

    <script>
        // ===================================
        // PRINCÍPIO 1: FATO É FATO
        // ===================================
        // Armazenar fatos é fundamental
        // Cada fato é uma verdade observada

        const FATOS = {
            lista: [],
            adicionar: function(fato) {
                if (fato && fato.trim()) {
                    this.lista.push({
                        id: Date.now(),
                        texto: fato.trim(),
                        data: new Date().toLocaleTimeString('pt-BR', { 
                            hour: '2-digit', 
                            minute: '2-digit' 
                        })
                    });
                    return true;
                }
                return false;
            },
            obter: function() {
                return this.lista;
            },
            limpar: function() {
                this.lista = [];
            }
        };

        // ===================================
        // PRINCÍPIO 2: LEI É LEI
        // ===================================
        // Regras são imutáveis
        // Princípios guiam a lógica

        const PRINCIPIOS = {
            1: "Fato é fato - Observação é verdade",
            2: "Lei é lei - Norma é imutável",
            3: "Lógica é lógica - Razão é universal",
            4: "Contradição é erro - Paradoxo não existe",
            5: "Silogismo é verdade - Conclusão é válida"
        };

        // ===================================
        // PRINCÍPIO 3: LÓGICA É LÓGICA
        // ===================================
        // Interface com o usuário
        // Comunicação clara e honesta

        const CHAT = {
            area: document.getElementById('chatArea'),
            inputField: document.getElementById('inputField'),
            btnSend: document.getElementById('btnSend'),

            adicionarMensagem: function(texto, tipo = 'robot') {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${tipo}`;

                const hora = new Date().toLocaleTimeString('pt-BR', { 
                    hour: '2-digit', 
                    minute: '2-digit' 
                });

                messageDiv.innerHTML = `
                    <div>
                        <div class="message-bubble">${this.escaparHTML(texto)}</div>
                        <div class="message-time">${hora}</div>
                    </div>
                `;

                this.area.appendChild(messageDiv);
                this.area.scrollTop = this.area.scrollHeight;
            },

            escaparHTML: function(texto) {
                const div = document.createElement('div');
                div.textContent = texto;
                return div.innerHTML;
            },

            limpar: function() {
                this.inputField.value = '';
                this.inputField.focus();
            }
        };

        // ===================================
        // PRINCÍPIO 4: CONTRADIÇÃO É ERRO
        // ===================================
        // Validação de entrada
        // Detecção de problemas

        const VALIDACAO = {
            verificarTextoVazio: function(texto) {
                return !texto || texto.trim() === '';
            },

            verificarComprimento: function(texto, minimo = 5) {
                return texto.trim().length < minimo;
            },

            validar: function(texto) {
                if (this.verificarTextoVazio(texto)) {
                    return {
                        valido: false,
                        erro: "❌ Erro: Texto não pode estar vazio"
                    };
                }

                if (this.verificarComprimento(texto)) {
                    return {
                        valido: false,
                        erro: "❌ Erro: Texto muito curto (mínimo 5 caracteres)"
                    };
                }

                return {
                    valido: true,
                    erro: null
                };
            }
        };

        // ===================================
        // PRINCÍPIO 5: SILOGISMO É VERDADE
        // ===================================
        // Processamento de entrada
        // Resposta lógica

        const PROCESSADOR = {
            processar: function(entrada) {
                // Validar entrada
                const validacao = VALIDACAO.validar(entrada);
                if (!validacao.valido) {
                    return validacao.erro;
                }

                // Adicionar fato
                FATOS.adicionar(entrada);

                // Responder
                const totalFatos = FATOS.obter().length;
                return `✅ Fato registrado! (Total: ${totalFatos} fato(s))\n\nFato: "${entrada}"\n\nAguardando próximo fato ou comando...`;
            }
        };

        // ===================================
        // EVENTOS
        // ===================================

        CHAT.btnSend.addEventListener('click', function() {
            const entrada = CHAT.inputField.value;

            if (entrada.trim()) {
                // Mostrar mensagem do usuário
                CHAT.adicionarMensagem(entrada, 'user');

                // Processar
                const resposta = PROCESSADOR.processar(entrada);

                // Mostrar resposta do robô
                setTimeout(() => {
                    CHAT.adicionarMensagem(resposta, 'robot');
                }, 300);

                // Limpar input
                CHAT.limpar();
            }
        });

        CHAT.inputField.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                CHAT.btnSend.click();
            }
        });

        // Foco no input ao carregar
        CHAT.inputField.focus();
    </script>
</body>
</html>
