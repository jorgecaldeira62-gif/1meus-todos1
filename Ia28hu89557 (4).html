<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navegador com Tradução</title>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        .toolbar {
            background: #333;
            color: white;
            padding: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .toolbar input {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 4px;
        }
        
        .toolbar button {
            padding: 8px 15px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .toolbar button:hover {
            background: #0056b3;
        }
        
        #google_translate_element {
            padding: 5px;
        }
        
        .browser-frame {
            flex: 1;
            border: none;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="toolbar">
            <input type="text" id="urlInput" placeholder="Digite o endereço do site..." value="https://www.example.com">
            <button onclick="abrirSite()">Acessar</button>
            <div id="google_translate_element"></div>
        </div>
        <iframe id="browser" class="browser-frame"></iframe>
    </div>

    <script>
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                includedLanguages: 'pt,en,es,fr,de',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE
            }, 'google_translate_element');
        }

        function abrirSite() {
            let url = document.getElementById('urlInput').value;
            
            // Adiciona https:// se não tiver protocolo
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }
            
            document.getElementById('browser').src = url;
        }

        // Abre o site padrão ao carregar
        window.onload = function() {
            abrirSite();
        };
    </script>
</body>
</html>
